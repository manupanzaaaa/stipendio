<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Calcolo Stipendio</title>
  <meta name="description" content="Calcolo di lordo e netto mensile con trasferte, straordinari e buoni pasto.">
  <meta name="theme-color" content="#1f5f8b">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icona.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icona.svg">
  <link rel="stylesheet" href="css/stile.css">
</head>
<body>
  <header class="testata">
    <div class="riga-mese">
      <button class="btn-icona" id="mesePrec" aria-label="Mese precedente">‹</button>
      <h1 id="titoloMese">—</h1>
      <button class="btn-icona" id="meseSucc" aria-label="Mese successivo">›</button>
    </div>
    <div class="riepilogo" id="riepilogo" role="button" tabindex="0" title="Apri il dettaglio della busta">
      <div><span class="etichetta">Lordo</span><strong id="lordo">—</strong></div>
      <div class="netto"><span class="etichetta">Netto stimato</span><strong id="netto">—</strong></div>
      <div><span class="etichetta">Accredito</span><strong id="accredito">—</strong></div>
    </div>
  </header>

  <nav class="schede" role="tablist">
    <button role="tab" data-vista="calendario" aria-selected="true">Calendario</button>
    <button role="tab" data-vista="busta">Busta</button>
    <button role="tab" data-vista="storico">Storico</button>
    <button role="tab" data-vista="impostazioni">Impostazioni</button>
  </nav>

  <main>
    <div id="bannerAvvio" class="banner" hidden></div>

    <section id="vista-calendario" class="vista">
      <div class="calendario-intestazione" id="calIntestazione"></div>
      <div class="calendario" id="calendario"></div>
      <div class="legenda" id="legenda"></div>
      <div class="azioni-mese">
        <button class="btn" id="riempiUfficio">Compila i giorni vuoti come Ufficio</button>
      </div>
      <div id="avvisiCal"></div>
    </section>

    <section id="vista-busta" class="vista" hidden>
      <div id="busta"></div>
      <div class="pannello-card">
        <h3>Voci manuali del mese</h3>
        <p class="aiuto">Una tantum, premi, rettifiche dell'ufficio paghe (es. un importo recuperato dal mese precedente).</p>
        <div id="vociManuali"></div>
        <button class="btn" id="aggiungiVoce">+ Aggiungi voce</button>
      </div>
      <div class="pannello-card">
        <h3>Confronto con la busta reale</h3>
        <label class="campo">Netto reale in busta (€)
          <input type="number" step="0.01" inputmode="decimal" id="nettoReale" placeholder="es. 2759,57">
        </label>
        <p id="confronto" class="aiuto"></p>
      </div>
      <div class="azioni-mese">
        <button class="btn primario" id="stampaMese">Scarica PDF del mese</button>
      </div>
    </section>

    <section id="vista-storico" class="vista" hidden>
      <div class="riga-anno">
        <button class="btn-icona" id="annoPrec" aria-label="Anno precedente">‹</button>
        <h2 id="titoloAnno">—</h2>
        <button class="btn-icona" id="annoSucc" aria-label="Anno successivo">›</button>
      </div>
      <div id="storico"></div>
      <div class="azioni-mese">
        <button class="btn primario" id="stampaAnno">Scarica PDF dell'anno</button>
      </div>
    </section>

    <section id="vista-impostazioni" class="vista" hidden>
      <div id="impostazioni"></div>
    </section>
  </main>

  <dialog id="dialogoGiorno">
    <form method="dialog" id="formGiorno">
      <header class="dialogo-testata">
        <h2 id="titoloGiorno">—</h2>
        <button class="btn-icona" value="annulla" aria-label="Chiudi">✕</button>
      </header>
      <div class="dialogo-corpo">
        <fieldset class="tipi" id="sceltaTipo"></fieldset>

        <div data-mostra="trasferta">
          <div class="segmentato" id="sceltaRegione">
            <label><input type="radio" name="regione" value="in" checked> In regione</label>
            <label><input type="radio" name="regione" value="fuori"> Fuori regione</label>
          </div>
        </div>

        <div data-mostra="lavoro" class="riga-campi">
          <label class="campo">Ore lavorate
            <input type="number" min="0" max="24" step="1" inputmode="numeric" id="ore">
          </label>
          <label class="campo">Minuti
            <select id="minuti"><option>0</option><option>15</option><option>30</option><option>45</option></select>
          </label>
          <p class="aiuto" id="aiutoOre"></p>
        </div>

        <div data-mostra="trasferta">
          <h3>Rimborsi (carta aziendale)</h3>
          <div class="spese">
            <label><input type="checkbox" id="rColazione"> Colazione</label><input type="number" step="0.01" inputmode="decimal" id="iColazione" placeholder="€">
            <label><input type="checkbox" id="rPranzo"> Pranzo</label><input type="number" step="0.01" inputmode="decimal" id="iPranzo" placeholder="€">
            <label><input type="checkbox" id="rCena"> Cena</label><input type="number" step="0.01" inputmode="decimal" id="iCena" placeholder="€">
            <label><input type="checkbox" id="rHotel"> Hotel</label><input type="number" step="0.01" inputmode="decimal" id="iHotel" placeholder="€">
          </div>
          <p class="aiuto" id="aiutoSpese"></p>
        </div>

        <div data-mostra="permessi" class="riga-campi">
          <label class="campo">Ore di permesso
            <input type="number" min="0" max="8" step="0.5" inputmode="decimal" id="permessoOre">
          </label>
        </div>

        <label class="campo">Nota
          <input type="text" id="nota" maxlength="200">
        </label>

        <details class="copia">
          <summary>Copia su più giorni</summary>
          <label class="campo">Applica uguale fino al
            <input type="date" id="copiaFino">
          </label>
          <label><input type="checkbox" id="copiaWeekend"> Includi sabati e domeniche</label>
        </details>
        <p id="infoTrasferta" class="aiuto"></p>
      </div>
      <footer class="dialogo-piede">
        <button class="btn pericolo" value="cancella" id="cancellaGiorno">Svuota giorno</button>
        <button class="btn primario" value="salva" id="salvaGiorno">Salva</button>
      </footer>
    </form>
  </dialog>

  <div id="stampa" class="solo-stampa"></div>
  <div id="toast" class="toast" role="status" hidden></div>

  <script src="js/motore.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
